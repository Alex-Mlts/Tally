<script>
/* Old links and QR codes point to /#something: send them straight to the app. */
if (location.hash.length > 1) location.replace("/app" + location.hash);
/* The gradient is dark, so the landing page always uses the dark Indigo & coral palette. */
document.documentElement.setAttribute("data-theme","indigo");document.documentElement.setAttribute("data-tone","dark");
</script>

<style>
:root{--f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100svh;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);display:grid;grid-template-rows:auto 1fr auto;position:relative;overflow-x:hidden}
/* soft glow behind the centre */
body::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 42%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
header,main,footer{position:relative;z-index:2}
/* animated gradient (loaded after first paint); a plain gradient shows until it is ready or if WebGL is unavailable */
#gradient{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity 1.2s ease;
  background:linear-gradient(135deg,#73bfc4,#8da0ce 55%,#ff810a)}
#gradient.ready{opacity:1}
#gradient::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:.5}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px clamp(16px,4vw,40px)}
.wordmark{display:block;height:44px;width:auto}
.wm-light{display:none}
:root[data-tone="dark"] .wm-light{display:block}
:root[data-tone="dark"] .wm-dark{display:none}

.tools{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;align-items:center;height:40px;padding:3px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.lang button{all:unset;box-sizing:border-box;cursor:pointer;height:32px;min-width:42px;padding:0 10px;border-radius:16px;display:grid;place-items:center;font:600 13px/1 var(--f-body);letter-spacing:.04em;color:var(--muted);transition:background .15s,color .15s}
.lang button:hover{color:var(--fg)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.lang button:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
/* GitHub pill: opens on hover, focus and scroll */
.gh{display:inline-flex;align-items:center;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);text-decoration:none;overflow:hidden;transition:border-color .15s,background .15s}
.gh svg{width:20px;height:20px;flex:none;fill:currentColor}
.gh span{display:inline-block;max-width:0;opacity:0;margin-left:0;white-space:nowrap;font-weight:600;font-size:13.5px;transition:max-width .25s ease,opacity .2s ease,margin-left .25s ease}
.gh:hover,.gh:focus-visible,.gh.open{border-color:var(--muted);background:var(--sunk)}
.gh:hover span,.gh:focus-visible span,.gh.open span{max-width:140px;opacity:1;margin-left:8px}
@media (hover:none){.gh span{max-width:140px;opacity:1;margin-left:8px}}

main{display:grid;place-content:center;justify-items:center;gap:22px;padding:24px 20px 72px;text-align:center}
.tagline{margin:0;font:600 clamp(30px,6vw,56px)/1.05 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.lead{margin:-6px 0 4px;max-width:34em;font-size:clamp(15px,2.2vw,18px);line-height:1.5;color:var(--fg);opacity:.82;text-wrap:balance}
.cta{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 28px;border-radius:26px;background:var(--accent);color:var(--accent-fg);font:600 17px/1 var(--f-body);text-decoration:none;box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s,box-shadow .15s,background .15s}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.cta:hover{background:var(--accent-strong);transform:translateY(-1px);box-shadow:0 12px 32px color-mix(in srgb,var(--accent) 45%,transparent)}
.cta:hover svg{transform:translateX(3px)}
.cta:focus-visible,.gh:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px}
.cta:active{transform:translateY(0)}

footer{padding:0 16px 14px;text-align:center;font-size:12.5px;color:var(--fg);opacity:.7}

@media (prefers-reduced-motion:reduce){
  .gh,.gh span,.cta,.cta svg{transition:none}
}
@media (max-width:520px){.wordmark{height:36px}main{padding-bottom:56px}}
</style>
</head>
<body>
<div id="gradient" aria-hidden="true"></div>
<header>
  <a href="/app" aria-label="Tally">
    <img class="wordmark wm-dark" src="tally-wordmark-dark-sm.png" alt="Tally" height="44">
    <img class="wordmark wm-light" src="tally-wordmark-light-sm.png" alt="" height="44" aria-hidden="true">
  </a>
  <div class="tools">
    <div class="lang" role="group" id="langGroup" aria-label="Language">
      <button type="button" data-lang="en" title="English">EN</button>
      <button type="button" data-lang="fr" title="Français">FR</button>
    </div>
    <a class="gh" id="gh" href="__REPO__" target="_blank" rel="noopener noreferrer" title="View source">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span id="ghText">View source</span>
    </a>
  </div>
</header>

<main>
  <h1 class="tagline" id="tagline">Equipment loan register</h1>
  <p class="lead" id="lead">Track who borrowed what: loans, inventory, reservations and printable slips.</p>
  <a class="cta" id="openBtn" href="/app"><span id="openText">Open Tally</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</main>

<footer>Tally v__VERSION__</footer>

<script>
(function(){
  /* GitHub pill also opens when the page is scrolled or a scroll gesture is attempted */
  var gh = document.getElementById("gh"), timer;
  function pulse(){ gh.classList.add("open"); clearTimeout(timer); timer = setTimeout(function(){ gh.classList.remove("open"); }, 2600); }
  addEventListener("scroll", pulse, {passive:true});
  addEventListener("wheel", pulse, {passive:true});
  addEventListener("touchmove", pulse, {passive:true});

  /* Animated gradient: loads after the first paint, skipped for reduced motion or when WebGL is missing */
  function gradient(){
    var g = document.getElementById("gradient");
    var ok = false; try{ var c = document.createElement("canvas"); ok = !!(c.getContext("webgl2") || c.getContext("webgl")); }catch(e){}
    if (!ok){ g.classList.add("ready"); return; }
    if (matchMedia("(prefers-reduced-motion: reduce)").matches){ g.classList.add("ready"); return; }
    var sc = document.createElement("script"); sc.src = "vendor/shadergradient.js";
    sc.onload = function(){ try{ window.TallyGradient.mount(g); setTimeout(function(){ g.classList.add("ready"); }, 400); }catch(e){ g.classList.add("ready"); } };
    sc.onerror = function(){ g.classList.add("ready"); };
    document.head.appendChild(sc);
  }
  if (document.readyState === "complete") setTimeout(gradient, 50); else addEventListener("load", function(){ setTimeout(gradient, 50); });

  /* Language: shown as the server's language setting; clicking a button changes that setting for the app */
  var TXT = {
    en: {tag:"Equipment loan register", lead:"Track who borrowed what: loans, inventory, reservations and printable slips.", open:"Open Tally", src:"View source", lang:"Language"},
    fr: {tag:"Registre de prêt de matériel", lead:"Suivez qui a emprunté quoi : prêts, inventaire, réservations et bordereaux imprimables.", open:"Ouvrir Tally", src:"Voir le code source", lang:"Langue"}
  };
  var LANG = "__LANG__"; if (!TXT[LANG]) LANG = "en";
  function apply(l){
    var d = TXT[l]; LANG = l;
    document.documentElement.lang = l;
    document.getElementById("tagline").textContent = d.tag;
    document.getElementById("lead").textContent = d.lead;
    document.getElementById("openText").textContent = d.open;
    document.getElementById("ghText").textContent = d.src; gh.title = d.src;
    document.getElementById("langGroup").setAttribute("aria-label", d.lang);
    var bs = document.querySelectorAll("#langGroup button");
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute("aria-pressed", String(bs[i].dataset.lang === l));
  }
  apply(LANG);
  document.getElementById("langGroup").addEventListener("click", function(e){
    var b = e.target.closest("button[data-lang]"); if (!b || b.dataset.lang === LANG) return;
    var prev = LANG, next = b.dataset.lang; apply(next);
    fetch("/api/settings", {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({defaultLang:next})})
      .then(function(r){ if (!r.ok) throw new Error(); })
      .catch(function(){ apply(prev); });
  });
})();
</script>
</body>
