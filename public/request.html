<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borrow equipment · Tally</title>
<meta name="description" content="Ask to borrow equipment: tell the IT team who you are, when you need it and what you need.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="themes.css">
<style>
:root{--f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--ok-ring:color-mix(in srgb,var(--accent) 22%,transparent)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- two halves: the story on the left, the form on the right ---------- */
.shell{display:grid;grid-template-columns:minmax(340px,44%) 1fr;min-height:100vh;min-height:100svh}
.intro{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;color:#f3f1ff;background:#06060a;isolation:isolate}
/* a still version of the gradient shows first, and stays if WebGL or motion is off */
.intro::before{content:"";position:absolute;inset:-10%;z-index:-2;background:
  radial-gradient(60% 55% at 70% 30%,#8d7dca 0%,transparent 60%),
  radial-gradient(55% 60% at 25% 75%,#606080 0%,transparent 62%),
  radial-gradient(40% 40% at 85% 85%,#212121 0%,transparent 70%),#000;filter:saturate(1.05)}
#gradient{position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity 1.4s ease}
#gradient.ready{opacity:1}
/* keeps the text readable over the brightest part of the wave */
.intro::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}
.intro-in{position:relative;height:100%;display:flex;flex-direction:column;gap:28px;padding:clamp(24px,4vw,48px)}
.brand{display:inline-flex;align-items:center;gap:12px;color:inherit;text-decoration:none;align-self:flex-start}
.brand img{height:40px;width:auto;display:block}
.brand .org{padding-left:12px;border-left:1px solid rgba(255,255,255,.3);font:600 17px/1.2 var(--f-display);letter-spacing:.01em;opacity:.9}
.pitch{margin-top:auto;max-width:30em}
.pitch h1{margin:0;font:600 clamp(34px,4.2vw,54px)/1.02 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
/* the follow-up page shows the mascot instead of the headline */
.rm{display:none;align-self:center;width:min(300px,62%);margin:auto 0;cursor:default}
body.follow .pitch{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.follow .rm{display:block}
.rm-svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 1.2px rgba(255,255,255,.5)) drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.rm svg *{transform-box:view-box}
.rm .tm-shadow{fill:rgba(0,0,0,.4)}
.rm .tm-p,.rm .tm-grip,.rm .tm-eyes-happy,.rm .tm-eyes-shut,.rm .tm-sweat,.rm .tm-m,.rm .tm-arm-up2,.rm .tm-spark{display:none}
.rm .tm-cheek{fill:#ff8fa3;opacity:.4}
.rm[data-m="smile"] .tm-m-smile,.rm[data-m="open"] .tm-m-open,.rm[data-m="sad"] .tm-m-sad,.rm[data-m="flat"] .tm-m-flat{display:inline}
.rm[data-eyes="happy"] .tm-eyes-open{display:none}
.rm[data-eyes="happy"] .tm-eyes-happy{display:inline}
.rm[data-p="confetti"] .tm-p-confetti{display:inline}
.rm.wave .tm-arm-r,.rm:not(.wave) .tm-arm-wave{display:none}
.rm.wave .tm-spark{display:inline;animation:rmSpark 1.2s ease-in-out infinite}
.rm.wave .tm-arm-wave{transform-origin:1180px 560px;animation:rmWave .45s ease-in-out infinite alternate}
.rm.wave .tm-char{animation:rmHop .9s ease-in-out infinite}
.rm:not(.wave) .tm-char{animation:rmBob 3s ease-in-out infinite}
.rm .tm-char{transform-origin:88px 144px}
.rm.in .tm-char{animation:rmArrive .7s cubic-bezier(.3,1.5,.5,1) both}
.rm .tm-eye{transform-box:fill-box;transform-origin:center;transition:transform .07s}
.rm.blink .tm-eye{transform:scaleY(.1)}
@keyframes rmWave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes rmHop{50%{transform:translateY(-4px)}}
@keyframes rmBob{50%{transform:translateY(-3px)}}
@keyframes rmArrive{from{transform:translateY(22px) scale(.9);opacity:0}}
@keyframes rmSpark{50%{opacity:.35}}
.track{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-width:22em}
.track li{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:12px;color:rgba(243,241,255,.62);font-weight:500;transition:background .3s,color .3s}
.track li b{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);font:600 13px/1 var(--f-body);transition:background .3s,border-color .3s,color .3s}
.track li b svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.track li.now{background:rgba(255,255,255,.1);color:#fff}
.track li.now b{background:#fff;border-color:#fff;color:#1a1530}
.track li.done{color:rgba(243,241,255,.85)}
.track li.done b{background:rgba(141,125,202,.55);border-color:transparent;color:#fff}
.intro-foot{font-size:12.5px;color:rgba(243,241,255,.55)}

/* ---------- the form ---------- */
.panel{display:flex;flex-direction:column;min-width:0;padding:clamp(20px,3.4vw,44px) clamp(18px,5vw,72px)}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.lang{display:inline-flex;align-items:center;height:38px;padding:3px;border:1px solid var(--line);border-radius:19px;background:var(--surface)}
.lang button{all:unset;box-sizing:border-box;cursor:pointer;height:30px;min-width:40px;padding:0 10px;border-radius:15px;display:grid;place-items:center;font:600 12.5px/1 var(--f-body);letter-spacing:.04em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:4px;margin:16px 0 0;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;width:25%;border-radius:4px;background:linear-gradient(90deg,#606080,#8d7dca);transition:width .5s cubic-bezier(.3,.8,.3,1)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:560px;margin:0 auto;padding:36px 0 24px}
.step{display:none}
.step.on{display:block;animation:stepIn .45s cubic-bezier(.2,.8,.3,1) both}
.step.on.back{animation-name:stepBack}
@keyframes stepIn{from{opacity:0;transform:translateX(26px)}}
@keyframes stepBack{from{opacity:0;transform:translateX(-26px)}}
.step h2{margin:0;font:600 clamp(28px,3.2vw,38px)/1.08 var(--f-display);letter-spacing:-.005em;outline:none}
.step .sub{margin:8px 0 26px;color:var(--muted);font-size:15.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field>span{font-size:13.5px;font-weight:600}
.field>span small{font-weight:400;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field input:hover,.field select:hover,.field textarea:hover{border-color:color-mix(in srgb,var(--fg) 28%,var(--line))}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--ok-ring)}
.field input[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:var(--bad)}
.field .err{display:none;font-style:normal;font-size:13px;color:var(--bad)}
.field .err.on{display:block}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
.acts{display:flex;align-items:center;gap:10px;margin-top:26px}
.acts .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 22px;border-radius:24px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg);transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.btn:hover{border-color:color-mix(in srgb,var(--fg) 35%,var(--line))}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.pri:hover{background:var(--accent-strong);border-color:var(--accent-strong);transform:translateY(-1px)}
.btn.pri:hover svg{transform:translateX(3px)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--sunk)}
.btn.ghost:hover svg{transform:translateX(-3px)}
.btn[disabled]{opacity:.6;cursor:default;transform:none}
.formerr{display:none;margin:18px 0 0;padding:11px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:500}
.formerr.on{display:block}

/* step 1: earlier requests from this browser */
.mine{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.mine h3{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mine a{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;color:var(--fg);text-decoration:none}
.mine a:hover{background:var(--sunk)}
.mine a span{color:var(--muted);font-size:13.5px}

/* step 2: dates */
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:-8px 0 20px}
.chip{min-height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent-text,var(--accent))}
.span-note{display:flex;align-items:center;gap:10px;margin:2px 0 4px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text,var(--accent));font-weight:600}
.span-note svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* step 3: equipment tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);transition:border-color .2s,box-shadow .2s,transform .2s}
.tile .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--sunk);color:var(--fg);transition:background .2s,color .2s}
.tile .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile .nm{font-weight:600;line-height:1.25}
.tile .av{font-size:12.5px;font-weight:600;color:var(--ok)}
.tile .av.low{color:var(--warn)}
.tile .av.none{color:var(--muted);font-weight:500}
.tile.picked{border-color:var(--accent);box-shadow:0 0 0 4px var(--ok-ring)}
.tile.picked .ic{background:var(--accent);color:var(--accent-fg)}
.tile.off{opacity:.62}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding:3px;border-radius:12px;background:var(--sunk)}
.stepper button{width:34px;height:34px;border:0;border-radius:9px;background:var(--surface);font-size:19px;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center}
.stepper button:hover:not([disabled]){color:var(--accent-text,var(--accent))}
.stepper button[disabled]{opacity:.35;cursor:default}
.stepper output{font-weight:700;min-width:2ch;text-align:center}
.tile.bump .stepper output{animation:bump .3s ease}
@keyframes bump{50%{transform:scale(1.35)}}
.loading{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.loading i{height:132px;border-radius:16px;background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.picked-sum{min-height:22px;margin:-4px 0 12px;font-size:13.5px;font-weight:600;color:var(--accent-text,var(--accent))}

/* step 4: review */
.review{border:1.5px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:20px}
.review>div{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start;padding:13px 16px}
.review>div+div{border-top:1px solid var(--line)}
.review dt{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.review dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.review dd>span{min-width:0}
.review dd small{display:block;color:var(--muted);font-weight:400}
.review button{border:0;background:none;color:var(--accent-text,var(--accent));font-weight:600;font-size:13.5px;cursor:pointer;padding:2px 4px;border-radius:6px}
.review button:hover{text-decoration:underline}
.terms{margin:0 0 12px;max-height:150px;overflow:auto;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:13.5px;white-space:pre-wrap;color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.note{display:flex;gap:10px;margin:0 0 18px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;fill:none;stroke:var(--accent-text,var(--accent));stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sent and status */
.tick{width:84px;height:84px;margin:0 0 22px}
.tick circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3;stroke-dasharray:252;stroke-dashoffset:252;animation:draw .6s ease forwards}
.tick path{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.refno{display:inline-flex;align-items:center;gap:10px;margin:4px 0 0;padding:8px 14px;border-radius:12px;background:var(--sunk);font:600 18px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}
.linkbox{display:flex;gap:8px;margin:22px 0 0}
.linkbox input{flex:1;min-width:0;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--sunk);font-size:13px;color:var(--muted)}
.timeline{list-style:none;margin:8px 0 26px;padding:0}
.timeline li{position:relative;display:grid;grid-template-columns:32px 1fr;gap:14px;padding:0 0 22px}
.timeline li::before{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline li.done::before{background:var(--accent)}
.timeline .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.timeline .dot svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.timeline li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.timeline li.now .dot{border-color:var(--accent);color:var(--accent-text,var(--accent));box-shadow:0 0 0 0 var(--ok-ring);animation:ping 1.8s ease-out infinite}
.timeline li.bad .dot{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.timeline b{display:block;padding-top:4px}
.timeline span{display:block;color:var(--muted);font-size:14px}
.timeline li.todo b{color:var(--muted);font-weight:500}
.closed-box{padding:22px;border-radius:16px;background:var(--sunk)}

/* ---------- phones and narrow windows: the story becomes a header band ---------- */
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .intro{position:relative;height:auto}
  .intro-in{min-height:0;gap:18px;padding:20px 18px 24px}
  .pitch{margin-top:8px}
  .pitch h1{font-size:32px}
  .track{display:none}
  .intro-foot{display:none}
  body:not(.first) .pitch{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .rm{width:130px;margin:4px auto 0}
  body:not(.first) .intro-in{padding-bottom:18px}
  .panel{padding:18px 16px 28px}
  .stage{justify-content:flex-start;padding-top:24px}
}
@media (max-width:480px){
  .grid2{grid-template-columns:1fr;gap:0}
  .review>div{grid-template-columns:1fr;gap:4px}
  .acts .btn.pri{flex:1}
  .brand img{height:34px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tick circle,.tick path{stroke-dashoffset:0}
}
</style>
</head>
<body class="first">
<div class="shell">
  <aside class="intro" aria-labelledby="pitchTitle">
    <div id="gradient" aria-hidden="true"></div>
    <div class="intro-in">
      <a class="brand" href="/request" id="brand"><img src="tally-wordmark-light-sm.png" alt="Tally" width="114" height="40"><span class="org" id="orgName" hidden></span></a>
      <div class="pitch">
        <h1 id="pitchTitle">Borrow what you need</h1>
      </div>
      <div class="rm" id="mascot" aria-hidden="true"></div>
      <ol class="track" id="track" aria-label="Steps"></ol>
      <p class="intro-foot" id="introFoot"></p>
    </div>
  </aside>

  <main class="panel" id="main">
    <div class="ptop">
      <span class="count" id="count" aria-live="polite"></span>
      <div class="lang" role="group" id="langSeg" aria-label="Language">
        <button type="button" data-l="en" aria-pressed="true">EN</button>
        <button type="button" data-l="fr" aria-pressed="false">FR</button>
      </div>
    </div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

    <div class="stage">
      <form id="form" novalidate>
        <!-- 1. who -->
        <section class="step on" data-step="1" aria-labelledby="h1">
          <h2 id="h1" tabindex="-1" data-t="s1Title"></h2>
          <p class="sub" data-t="s1Sub"></p>
          <div class="grid2">
            <label class="field"><span data-t="first"></span><input id="firstName" autocomplete="given-name" maxlength="80" required><em class="err" data-for="firstName"></em></label>
            <label class="field"><span data-t="last"></span><input id="lastName" autocomplete="family-name" maxlength="80" required><em class="err" data-for="lastName"></em></label>
          </div>
          <label class="field"><span data-t="email"></span><input id="email" type="email" autocomplete="email" inputmode="email" maxlength="160" required><em class="err" data-for="email"></em></label>
          <label class="hp" aria-hidden="true">Website <input id="website" tabindex="-1" autocomplete="off"></label>
          <div class="acts"><span class="grow"></span><button class="btn pri" type="submit"><span data-t="next"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
          <div class="mine" id="mine" hidden><h3 data-t="mine"></h3><div id="mineList"></div></div>
        </section>

        <!-- 2. when -->
        <section class="step" data-step="2" aria-labelledby="h2">
          <h2 id="h2" tabindex="-1" data-t="s2Title"></h2>
          <p class="sub" data-t="s2Sub"></p>
          <div class="quick" id="quick"></div>
          <div class="grid2">
            <label class="field"><span data-t="from"></span><input id="startDate" type="date" required><em class="err" data-for="startDate"></em></label>
            <label class="field"><span data-t="to"></span><input id="endDate" type="date" required><em class="err" data-for="endDate"></em></label>
          </div>
          <label class="field" id="siteField" hidden><span><span data-t="site"></span> <small data-t="optional"></small></span><select id="site"></select></label>

var tilesFor = "";
function loadTiles(){
  var a = $("startDate").value, b = $("endDate").value, key = a + "|" + b;
  $("s3Sub").textContent = t("s3Sub", {from: fmt(a), to: fmt(b)});
  if (tilesFor === key){ renderTiles(); return; }
  $("tiles").innerHTML = '<div class="loading" aria-hidden="true"><i></i><i></i><i></i></div>';
  fetch("/api/public/availability?from=" + a + "&to=" + b).then(function(r){ return r.ok ? r.json() : Promise.reject(r); }).then(function(list){
    cat = list; tilesFor = key;
    cat.forEach(function(c){ if (c.free !== null && qty[c.key] > c.free && c.total) qty[c.key] = c.free; });
    renderTiles();
  }).catch(function(){ cat = []; tilesFor = ""; renderTiles(); $("formErr").textContent = t("errNet"); $("formErr").classList.add("on"); });
}
var maxFor = function(c){ return c.total ? c.free : 5; };
function renderTiles(){
  if (!cat.length){ $("tiles").innerHTML = ""; $("s3Sub").textContent = t("s3SubNone"); pickedSum(); return; }
  $("tiles").innerHTML = '<div class="tiles" role="list">' + cat.map(function(c){
    var n = qty[c.key] || 0, mx = maxFor(c), name = c.name || (lang === "fr" ? "Autre matériel" : "Other equipment");
    var av = !c.total ? '<span class="av none">' + esc(t("ask")) + '</span>' : c.free === 0 ? '<span class="av none">' + esc(t("none")) + '</span>'
      : '<span class="av' + (c.free <= 1 && c.total > 2 ? " low" : "") + '">' + esc(c.free <= 1 && c.total > 2 ? t("freeLow", {n: c.free}) : c.free === 1 ? t("free1") : t("freeN", {n: c.free})) + '</span>';
    return '<div class="tile' + (n ? " picked" : "") + (c.total && !c.free ? " off" : "") + '" role="listitem" data-k="' + esc(c.key) + '">' +
      '<span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24">' + iconFor(name) + '</svg></span>' +
      '<span class="nm">' + esc(name) + '</span>' + av +
      '<div class="stepper"><button type="button" data-d="-1" aria-label="' + esc(t("minus", {x: name})) + '"' + (n ? "" : " disabled") + '>−</button>' +
      '<output aria-live="polite" aria-label="' + esc(t("qty", {x: name, n: n})) + '">' + n + '</output>' +
      '<button type="button" data-d="1" aria-label="' + esc(t("plus", {x: name})) + '"' + (n < mx ? "" : " disabled") + '>+</button></div></div>';
  }).join("") + '</div>';
  pickedSum();
}
$("tiles").addEventListener("click", function(e){
  var b = e.target.closest("button[data-d]"); if (!b) return;
  var tile = b.closest(".tile"), k = tile.dataset.k, c = cat.filter(function(x){ return x.key === k; })[0]; if (!c) return;
  qty[k] = Math.max(0, Math.min(maxFor(c), (qty[k] || 0) + Number(b.dataset.d)));
  var d = b.dataset.d; renderTiles(); setErr("other", "");
  var nt = $("tiles").querySelector('.tile[data-k="' + CSS.escape(k) + '"]');
  if (nt){ nt.classList.add("bump"); var again = nt.querySelector('button[data-d="' + d + '"]'); (again && !again.disabled ? again : nt.querySelector("button:not([disabled])") || nt).focus(); }
});
function pickedSum(){
  var n = Object.keys(qty).reduce(function(a, k){ return a + (qty[k] || 0); }, 0);
  $("pickedSum").textContent = n ? t("picked", {n: n}) : "";
}
function lines(){ return cat.filter(function(c){ return qty[c.key] > 0; }).map(function(c){ return {category: c.name, qty: qty[c.key], label: c.name || (lang === "fr" ? "Autre matériel" : "Other equipment")}; }); }

// ---------- step 4 ----------
function deptField(){
  var list = info.departments, has = list.length > 0, cur = deptValue() || draftDept;
  $("deptLabel").textContent = has ? t("dept") : t("deptOpt");
  $("deptSel").hidden = !has; $("deptIn").hidden = has;
  if (has) $("deptSel").innerHTML = '<option value="">' + esc(t("choose")) + '</option>' + list.map(function(s){ return '<option' + (s === cur ? " selected" : "") + '>' + esc(s) + '</option>'; }).join("");
  else if (cur && !$("deptIn").value) $("deptIn").value = cur;
}
var deptValue = function(){ return info.departments.length ? $("deptSel").value : $("deptIn").value.trim(); };
$("deptSel").addEventListener("change", function(){ setErr("dept", ""); });
function renderReview(){
  var a = $("startDate").value, b = $("endDate").value, ls = lines(), other = $("other").value.trim(), site = $("site").value;
  var what = ls.map(function(l){ return l.qty + " × " + esc(l.label); }).join("<br>") + (other ? (ls.length ? "<small>" : "") + esc(other) + (ls.length ? "</small>" : "") : "");
  $("review").innerHTML =
    row(t("rYou"), esc($("firstName").value.trim() + " " + $("lastName").value.trim()) + "<small>" + esc($("email").value.trim()) + "</small>", 1) +
    row(t("rWhen"), esc(fmt(a)) + " → " + esc(fmt(b)) + "<small>" + esc(daysTxt(span(a, b))) + (site ? " · " + esc(site) : "") + "</small>", 2) +
    row(t("rWhat"), what, 3);
  $("reqNote").hidden = !info.note; $("reqNoteText").textContent = info.note || "";
  $("termsBox").hidden = !info.terms; $("terms").textContent = info.terms || "";
}
function row(label, html, go){ return '<div><dt>' + esc(label) + '</dt><dd><span>' + html + '</span>' + (go ? '<button type="button" data-go="' + go + '">' + esc(t("change")) + '</button>' : '') + '</dd></div>'; }
$("review").addEventListener("click", function(e){ var b = e.target.closest("button[data-go]"); if (b) show(Number(b.dataset.go), -1); });
$("accept").addEventListener("change", function(){ setErr("accept", ""); });

function send(){
  var btn = $("sendBtn"), label = btn.querySelector("span");
  btn.disabled = true; label.textContent = t("sending"); $("formErr").classList.remove("on");
  var body = { firstName: $("firstName").value.trim(), lastName: $("lastName").value.trim(), email: $("email").value.trim(), website: $("website").value,
    department: deptValue(), site: $("site").value, startDate: $("startDate").value, endDate: $("endDate").value,
    lines: lines().map(function(l){ return {category: l.category, qty: l.qty}; }), other: $("other").value.trim(), reason: $("reason").value.trim(),
    acceptTerms: $("accept").checked, lang: lang };
  saveDraft();
  fetch("/api/public/requests", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) throw new Error(j.error || t("errNet")); return j; }); })
    .then(function(j){
      var list = []; try{ list = JSON.parse(store.get("tally.requests") || "[]"); }catch(_){}
      list.unshift({no: j.reqNo, token: j.token, at: today()}); store.set("tally.requests", JSON.stringify(list.slice(0, 12)));
      var link = location.origin + "/request?r=" + j.token;
      $("sentNo").textContent = j.reqNo; $("sentLink").value = link; $("followBtn").href = "/request?r=" + j.token;
      $("sentText").textContent = t("sentText");
      history.replaceState(null, "", "/request?r=" + j.token);
      only("sent");
    })
    .catch(function(ex){ $("formErr").textContent = ex.message || t("errNet"); $("formErr").classList.add("on"); })
    .then(function(){ btn.disabled = false; label.textContent = t("send"); });
}
$("copyLink").addEventListener("click", function(){
  var b = this, done = function(){ b.querySelector("span").textContent = t("copied"); setTimeout(function(){ b.querySelector("span").textContent = t("copy"); }, 1500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText($("sentLink").value).then(done, function(){});
  else { $("sentLink").select(); try{ document.execCommand("copy"); done(); }catch(_){} }
});
$("followBtn").addEventListener("click", function(e){ e.preventDefault(); openStatus(new URLSearchParams(this.search).get("r")); });

// ---------- earlier requests and their status ----------
function mine(){
  var list = []; try{ list = JSON.parse(store.get("tally.requests") || "[]"); }catch(_){}
  $("mine").hidden = !list.length;
  $("mineList").innerHTML = list.slice(0, 4).map(function(x){ return '<a href="/request?r=' + encodeURIComponent(x.token) + '"><b>' + esc(x.no) + '</b><span>' + esc(t("sentOn", {d: fmt(x.at)})) + '</span></a>'; }).join("");
}

\"tm-p tm-p-alert\"> <path d=\"M134 50 l20 34 a3 3 0 0 1 -2.6 4.5 h-34.8 a3 3 0 0 1 -2.6 -4.5 l17.4 -34 a3 3 0 0 1 2.6 0z\" fill=\"#ef3e3e\"/> <path d=\"M135.4 62 v13\" stroke=\"#fff\" stroke-width=\"4.6\" stroke-linecap=\"round\"/><circle cx=\"135.4\" cy=\"81.5\" r=\"2.7\" fill=\"#fff\"/> <\/g> <g class=\"tm-p tm-p-check\"><circle cx=\"140\" cy=\"38\" r=\"14\" fill=\"#22b35e\"/><path d=\"M133 38 l5 5 9 -10\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/><\/g> <g class=\"tm-p tm-p-q\"><path d=\"M134 22 q0 -9 9 -9 q9 0 9 8 q0 6 -7 8 q-2 1 -2 5\" stroke=\"#2f6bff\" stroke-width=\"5\" stroke-linecap=\"round\" fill=\"none\"/><circle cx=\"143\" cy=\"42\" r=\"3\" fill=\"#2f6bff\"/><\/g> <g class=\"tm-p tm-p-bulb\"> <g stroke=\"#ffc83d\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M137 6 v-6\"/><path d=\"M120 13 l-4 -4\"/><path d=\"M154 13 l4 -4\"/><path d=\"M114 27 h-6\"/><path d=\"M160 27 h6\"/><\/g> <path d=\"M137 12 a14 14 0 0 1 8 25 v6 h-16 v-6 a14 14 0 0 1 8 -25z\" fill=\"#ffd34d\"/><rect x=\"130\" y=\"44\" width=\"14\" height=\"6\" rx=\"2\" fill=\"#7b8396\"/> <\/g> <g class=\"tm-p tm-p-heart\"> <path d=\"M118 102 c-8 -10 2 -20 10 -12 c8 -8 18 2 10 12 l-10 11z\" fill=\"#ef3e5a\"/> <path d=\"M144 42 c-3 -4 1 -8 4 -5 c3 -3 7 1 4 5 l-4 4z\" fill=\"#ff6b84\"/> <ellipse cx=\"114\" cy=\"108\" rx=\"7.5\" ry=\"9\" fill=\"#0f1433\"/><ellipse cx=\"142\" cy=\"106\" rx=\"7.5\" ry=\"9\" fill=\"#0f1433\"/> <\/g> <g class=\"tm-p tm-p-confetti\" stroke-width=\"4\" stroke-linecap=\"round\"> <path d=\"M10 70 l8 4\" stroke=\"#3b82ff\"/><path d=\"M18 46 l3 -9\" stroke=\"#ffc83d\"/><path d=\"M150 50 l8 -4\" stroke=\"#22b35e\"/><path d=\"M148 92 l9 3\" stroke=\"#ef3e5a\"/><path d=\"M124 18 l4 -8\" stroke=\"#3b82ff\"/><path d=\"M36 14 l-2 -9\" stroke=\"#ef3e5a\"/> <\/g> <\/g> <\/g> <g class=\"tm-grip\"><ellipse cx=\"50\" cy=\"104\" rx=\"12\" ry=\"9\" fill=\"#0d1a3e\"/><ellipse cx=\"138\" cy=\"102\" rx=\"12\" ry=\"9\" fill=\"#0d1a3e\"/><ellipse cx=\"47\" cy=\"100\" rx=\"4\" ry=\"2\" fill=\"#4d5c82\" opacity=\".6\"/><ellipse cx=\"135\" cy=\"98\" rx=\"4\" ry=\"2\" fill=\"#4d5c82\" opacity=\".6\"/><\/g> <\/svg>";
var blinkT = 0, waveT = 0;
function mascot(r){
  var m = $("mascot");
  if (!m.firstChild) m.innerHTML = MASCOT;
  var st = !r ? "lost" : r.status === "declined" || r.status === "cancelled" || (r.trail && r.trail.status === "cancelled") ? "sad"
    : r.trail && r.trail.loan && r.trail.loan.returnDate ? "done" : r.status === "approved" ? "happy" : "wait";
  m.dataset.m = st === "sad" || st === "lost" ? "sad" : st === "wait" ? "smile" : "open";
  m.dataset.eyes = st === "happy" || st === "done" ? "happy" : "";
  m.dataset.p = st === "done" ? "confetti" : "";
  clearTimeout(waveT); clearTimeout(blinkT);
  if (reduced()) { m.classList.remove("wave"); return; }
  m.classList.add("in"); setTimeout(function(){ m.classList.remove("in"); }, 750);
  if (st !== "sad" && st !== "lost"){ m.classList.add("wave"); waveT = setTimeout(function(){ m.classList.remove("wave"); }, 2600); } else m.classList.remove("wave");
  (function blink(){ blinkT = setTimeout(function(){ m.classList.add("blink"); setTimeout(function(){ m.classList.remove("blink"); }, 140); blink(); }, 2600 + Math.random() * 3200); })();
}
var lastStatus = null, statusToken = "";
function openStatus(token){
  statusToken = token;
  history.replaceState(null, "", "/request?r=" + encodeURIComponent(token));
  fetch("/api/public/requests/" + encodeURIComponent(token)).then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error); return j; }); })
    .then(function(r){ lastStatus = r; renderStatus(r); only("status"); mascot(r); })
    .catch(function(){ $("stTitle").textContent = t("notFound"); $("stSub").textContent = ""; $("timeline").innerHTML = ""; $("stReview").innerHTML = ""; $("cancelReq").hidden = true; only("status"); mascot(null); });
}
function renderStatus(r){
  $("stTitle").textContent = t("stTitle", {no: r.reqNo});
  $("stSub").textContent = t("stSub", {d: fmt(r.createdAt.slice(0, 10))});
  var tr = r.trail, steps = [{k: "done", b: t("tSent"), s: fmt(r.createdAt.slice(0, 10))}];
  if (r.status === "pending") steps.push({k: "now", b: t("tWaiting"), s: t("tWaitingSub")}, {k: "todo", b: t("tApproved")}, {k: "todo", b: t("tReady")});
  else if (r.status === "declined") steps.push({k: "bad", b: t("tDeclined"), s: r.decisionNote ? t("reasonWas", {r: r.decisionNote}) : t("tDeclinedSub")});
  else if (r.status === "cancelled") steps.push({k: "bad", b: t("tCancelled"), s: t("tCancelledSub")});
  else if (r.status === "approved"){
    steps.push({k: "done", b: t("tApproved"), s: tr ? t("tApprovedSub", {from: fmt(tr.startDate), to: fmt(tr.endDate), no: tr.resNo}) : ""});
    if (tr && tr.status === "cancelled") steps.push({k: "bad", b: t("tCancelled"), s: t("tResCancelled")});
    else if (tr && tr.loan && tr.loan.returnDate) steps.push({k: "done", b: t("tOut"), s: t("tOutSub", {d: fmt(tr.loan.dueDate), no: tr.loan.slipNo})}, {k: "done", b: t("tBack"), s: t("tBackSub", {d: fmt(tr.loan.returnDate)})});
    else if (tr && tr.loan) steps.push({k: "done", b: t("tOut"), s: t("tOutSub", {d: fmt(tr.loan.dueDate), no: tr.loan.slipNo})}, {k: "now", b: t("tBack")});
    else steps.push({k: "now", b: t("tReady"), s: tr ? t("tReadySub", {from: fmt(tr.startDate)}) : ""}, {k: "todo", b: t("tOut")});
  }
  $("timeline").innerHTML = steps.map(function(s){
    var ic = s.k === "done" ? CHECK : s.k === "bad" ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>' : "";
    return '<li class="' + s.k + '"' + (s.k === "now" ? ' aria-current="step"' : "") + '><span class="dot">' + ic + '</span><div><b>' + esc(s.b) + '</b>' + (s.s ? '<span>' + esc(s.s) + '</span>' : "") + '</div></li>';
  }).join("");
  var what = r.lines.map(function(l){ return l.qty + " × " + esc(l.category || (lang === "fr" ? "Autre matériel" : "Other equipment")); }).join("<br>") + (r.other ? (r.lines.length ? "<small>" : "") + esc(r.other) + (r.lines.length ? "</small>" : "") : "");
  $("stReview").innerHTML = row(t("rYou"), esc(r.firstName + " " + r.lastName) + (r.department ? "<small>" + esc(r.department) + "</small>" : ""), 0) +
    row(t("rWhen"), esc(fmt(r.startDate)) + " → " + esc(fmt(r.endDate)) + "<small>" + esc(daysTxt(span(r.startDate, r.endDate))) + "</small>", 0) + row(t("rWhat"), what, 0);
  $("cancelReq").hidden = r.status !== "pending";
}
$("cancelReq").addEventListener("click", function(){
  if (!confirm(t("cancelAsk"))) return;
  fetch("/api/public/requests/" + encodeURIComponent(statusToken) + "/cancel", {method: "POST"}).then(function(r){ return r.json(); }).then(function(r){ if (r && r.reqNo){ lastStatus = r; renderStatus(r); mascot(r); } });
});

// ---------- language ----------
$("langSeg").addEventListener("click", function(e){
  var b = e.target.closest("button[data-l]"); if (!b || b.dataset.l === lang) return;
  lang = b.dataset.l; store.set("tally.reqLang", lang); applyTexts();
  document.querySelectorAll(".err.on").forEach(function(el){ el.classList.remove("on"); });
});

// ---------- the gradient on the left: loads after the first paint, skipped for reduced motion or without WebGL ----------
function gradient(){
  var g = $("gradient"), ok = false;
  try{ var c = document.createElement("canvas"); ok = !!(c.getContext("webgl2") || c.getContext("webgl")); }catch(_){}
  if (!ok || reduced()) return;
  var sc = document.createElement("script"); sc.src = "vendor/shadergradient.js";
  sc.onload = function(){ try{ window.TallyGradient.mount(g, "landing"); setTimeout(function(){ g.classList.add("ready"); }, 500); }catch(_){} };
  document.head.appendChild(sc);
}
if (document.readyState === "complete") setTimeout(gradient, 60); else addEventListener("load", function(){ setTimeout(gradient, 60); });

// ---------- start ----------
var saved = store.get("tally.reqLang");
fetch("/api/public/request-info").then(function(r){ return r.json(); }).then(function(i){
  info = Object.assign(info, i || {});
  lang = saved === "fr" || saved === "en" ? saved : (i.lang === "fr" ? "fr" : "en");
  if (i.theme && i.theme !== "auto") document.documentElement.setAttribute("data-theme", i.theme);
  if (i.orgName){ $("orgName").textContent = i.orgName; $("orgName").hidden = false; }
  start();
}).catch(function(){ lang = saved === "fr" ? "fr" : "en"; start(); });
function start(){
  loadDraft();
  var td = today(); $("startDate").min = td; $("endDate").min = td;
  applyTexts();
  var token = new URLSearchParams(location.search).get("r");
  if (token) return openStatus(token);
  if (info.enabled === false) return only("closed");
  show(1, 0);
}
})();
</script>
