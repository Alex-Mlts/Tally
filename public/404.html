<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Tally</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/themes.css">
<script>document.documentElement.setAttribute("data-theme","indigo");document.documentElement.setAttribute("data-tone","dark");</script>
<style>
:root{--f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100svh;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);display:grid;grid-template-rows:auto 1fr auto;position:relative;overflow-x:hidden}
body::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(60% 50% at 50% 40%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),
  radial-gradient(50% 40% at 85% 100%,color-mix(in srgb,var(--tape) 12%,transparent),transparent 70%)}
header,main,footer{position:relative;z-index:2}
header{padding:22px clamp(16px,4vw,40px)}
.wordmark{display:block;height:44px;width:auto}
main{display:grid;place-content:center;justify-items:center;gap:14px;padding:24px 20px 180px;text-align:center}
.code{margin:0;font:700 clamp(96px,22vw,200px)/.9 var(--f-display);letter-spacing:-.02em;background:linear-gradient(180deg,var(--fg),color-mix(in srgb,var(--accent) 60%,var(--bg)));-webkit-background-clip:text;background-clip:text;color:transparent}
.title{margin:0;font:600 clamp(24px,4.5vw,36px)/1.1 var(--f-display)}
.lead{margin:0 0 10px;max-width:30em;color:var(--muted);font-size:clamp(15px,2.2vw,17px);text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:24px;font:600 16px/1 var(--f-body);text-decoration:none;transition:transform .15s,background .15s,border-color .15s}
.btn.primary{background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{background:var(--accent-strong);transform:translateY(-1px)}
.btn.ghost{border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.ghost:hover{border-color:var(--muted);background:var(--sunk)}
.btn:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px}
footer{padding:0 16px 14px;text-align:center;font-size:12.5px;color:var(--muted)}
footer code{font-family:ui-monospace,Consolas,monospace;color:var(--fg);opacity:.8;word-break:break-all}
#tally{position:absolute;left:0;right:0;bottom:34px;height:150px;z-index:1;pointer-events:none;-webkit-mask-image:linear-gradient(to top,#000 40%,transparent);mask-image:linear-gradient(to top,#000 40%,transparent)}
#tally svg{display:block;width:100%;height:100%;overflow:visible}
#tally line{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 13s ease-in-out infinite both}
#tally .v{stroke:var(--muted);opacity:.7}
#tally .s{stroke:var(--accent)}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}7%{stroke-dashoffset:0;opacity:1}78%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}
@media (prefers-reduced-motion:reduce){#tally line{animation:none;stroke-dashoffset:0}.btn{transition:none}}
@media (max-width:520px){.wordmark{height:36px}main{padding-bottom:150px}}
</style>
</head>
<body>
<header>
  <a href="/" aria-label="Tally"><img class="wordmark" src="/tally-wordmark-light-sm.png" alt="Tally" height="44"></a>
</header>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1 class="title" id="title">Page not found</h1>
  <p class="lead" id="lead">The page you are looking for does not exist, or it has moved.</p>
  <div class="actions">
    <a class="btn primary" id="openBtn" href="/app">Open Tally</a>
    <a class="btn ghost" id="homeBtn" href="/">Home</a>
  </div>
</main>
<div id="tally" aria-hidden="true"></div>
<footer><code id="path"></code></footer>
<script>
(function(){
  document.getElementById("path").textContent = location.pathname;
  var box = document.getElementById("tally"), NS = "http://www.w3.org/2000/svg", seed = 11;
  function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function build(){
    seed = 11; box.innerHTML = "";
    var w = box.clientWidth || innerWidth, h = 150, gw = w < 560 ? 84 : 112, n = Math.ceil(w / gw) + 1;
    var svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "0 0 " + w + " " + h); svg.setAttribute("preserveAspectRatio", "none");
    function line(x1,y1,x2,y2,cls,delay,sw){
      var l = document.createElementNS(NS, "line");
      l.setAttribute("x1",x1); l.setAttribute("y1",y1); l.setAttribute("x2",x2); l.setAttribute("y2",y2);
      l.setAttribute("pathLength","1"); l.setAttribute("class",cls); l.setAttribute("stroke-width",sw);
      l.style.animationDelay = delay.toFixed(2) + "s"; svg.appendChild(l);
    }
    for (var g = 0; g < n; g++){
      var x0 = g * gw + (gw - 66) / 2 + (rnd() - .5) * 10, base = h - 8 - rnd() * 14, top = base - (62 + rnd() * 24), t0 = g * .55;
      for (var i = 0; i < 4; i++){ var x = x0 + i * 18, j = (rnd() - .5) * 5; line(x + j, base, x - j, top + (rnd() - .5) * 6, "v", t0 + i * .28, 4); }
      line(x0 - 10, base - 14, x0 + 66, top + 16, "s", t0 + 1.2, 4.5);
    }
    box.appendChild(svg);
  }
  build();
  var rt; addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(build, 200); });
  var TXT = {
    fr: {title:"Page introuvable", lead:"La page recherchée n'existe pas ou a été déplacée.", open:"Ouvrir Tally", home:"Accueil"}
  };
  fetch("/api/settings").then(function(r){ return r.json(); }).then(function(s){
    var d = TXT[s && s.defaultLang]; if (!d) return;
    document.documentElement.lang = "fr";
    document.getElementById("title").textContent = d.title; document.getElementById("lead").textContent = d.lead;
    document.getElementById("openBtn").textContent = d.open; document.getElementById("homeBtn").textContent = d.home;
    document.title = d.title + " · Tally";
  }).catch(function(){});
})();
</script>
</body>
</html>
